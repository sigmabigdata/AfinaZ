services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile-postgres
    image: afina-postgres:16-pgaudit
    container_name: afina-postgres-dev
    environment:
      POSTGRES_DB: afina_db
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: ${DB_SUPERUSER_PASSWORD:-dev_password_change_me}
      # Пароли ролей, создаваемых init-скриптом db/init/02_roles.sh
      DB_PASSWORD: ${DB_PASSWORD:-dev_app_password}
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD:-dev_migrator_password}
      DB_AUDITOR_PASSWORD: ${DB_AUDITOR_PASSWORD:-dev_auditor_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    command: >
      postgres
        -c shared_preload_libraries=pgaudit,pg_stat_statements
        -c pg_stat_statements.track=all
        -c pg_stat_statements.max=10000
        -c track_io_timing=on
        -c log_min_duration_statement=1000
        -c logging_collector=on
        -c log_directory=/var/lib/postgresql/data/pg_log
        -c log_filename='postgresql-%Y-%m-%d.log'
        -c log_rotation_age=1d
        -c log_rotation_size=100MB
        -c log_line_prefix='%m [%p] %q%u@%d '
        -c log_statement=none
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d afina_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata_dev:
