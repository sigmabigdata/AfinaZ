# ============================================================
# AfinaZ · Angie (форк Nginx, сертифицирован ФСТЭК)
# Заменяет Caddyfile. Автоматический ACME встроен в Angie.
# ============================================================
# Документация: https://angie.software/ru/docs/
# ============================================================

# ---- HTTP: ACME-челлендж + редирект на HTTPS ----
server {
    listen 80;
    server_name ${APP_DOMAIN} www.${APP_DOMAIN};

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS: основной домен ----
server {
    listen 443 ssl;
    http2 on;
    server_name ${APP_DOMAIN};

    # Автоматический выпуск сертификата через Let's Encrypt
    acme letsencrypt;
    ssl_certificate $acme_certificate;
    ssl_certificate_key $acme_certificate_key;

    # Безопасные TLS-настройки по умолчанию (Angie сам применяет modern config)

    # Логи (Angie по умолчанию пишет в /var/log/angie/)
    access_log /var/log/angie/access.log;
    error_log  /var/log/angie/error.log warn;

    # Отдаём реальный IP клиента приложению
    # (совпадает с X-Forwarded-For, который читает RateLimitFilter)
    location / {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Размер загружаемых файлов (совпадает с spring.servlet.multipart)
        client_max_body_size 50m;
    }
}

# ---- HTTPS: www → без www ----
server {
    listen 443 ssl;
    http2 on;
    server_name www.${APP_DOMAIN};

    acme letsencrypt;
    ssl_certificate $acme_certificate;
    ssl_certificate_key $acme_certificate_key;

    return 301 https://${APP_DOMAIN}$request_uri;
}
