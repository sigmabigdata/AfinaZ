# ============================================================
# AfinaZ · Angie (форк Nginx, сертифицирован ФСТЭК)
# ============================================================
# Основной домен: afinasystems.ru
# www.afinasystems.ru → редирект на https://afinasystems.ru
# ACME: Let's Encrypt, автоматически
# ============================================================

worker_processes  auto;
error_log  /var/log/angie/error.log warn;
pid        /var/run/angie.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/angie/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Docker embedded DNS — резолвит и имена контейнеров, и внешние
    resolver 127.0.0.11 valid=10s;
    resolver_timeout 10s;

    # ACME-клиент Let's Encrypt
    acme_client letsencrypt https://acme-v02.api.letsencrypt.org/directory;

    # Backend
    upstream afina_backend {
        server afina-app:8080;
    }

    # ---- HTTP: ACME + редирект на HTTPS ----
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name afinasystems.ru;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---- HTTPS: основной домен ----
    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        http2 on;
        server_name afinasystems.ru;

        acme letsencrypt;

        ssl_certificate     $acme_cert_letsencrypt;
        ssl_certificate_key $acme_cert_key_letsencrypt;

        location / {
            proxy_pass http://afina_backend;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;

            proxy_connect_timeout 10s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;

            client_max_body_size 50m;
        }
    }

}
