spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: AfinaHikariPool
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 900000
      connection-timeout: 30000
      keepalive-time: 120000
      connection-test-query: "SELECT 1"
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 30
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    url: ${DB_URL}
    user: ${DB_MIGRATOR_USER}
    password: ${DB_MIGRATOR_PASSWORD}
    baseline-on-migrate: false
    clean-disabled: true
    validate-on-migrate: true
    locations: classpath:db/migration
    schemas: public
    table: flyway_schema_history

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: ${MAIL_SSL:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

  thymeleaf:
    cache: true
    encoding: UTF-8

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
    session:
      timeout: 600m
      cookie:
        http-only: true
        secure: ${SECURE_COOKIES:true}
        same-site: lax
        max-age: 10h
  tomcat:
    connection-timeout: 60000
    keep-alive-timeout: 60000
    max-keep-alive-requests: 200
    threads:
      max: 200
      min-spare: 20
  error:
    whitelabel:
      enabled: false
    include-message: never
    include-stacktrace: never

spring.lifecycle:
  timeout-per-shutdown-phase: 30s

app:
  db-superuser: ${DB_SUPERUSER:postgres}
  db-superuser-password: ${DB_SUPERUSER_PASSWORD:}
  backups-path: /app/backups
  logs-path: /app/logs
  storage-path: ${APP_STORAGE_PATH}
  base-url: ${APP_BASE_URL}
  admin-ip-whitelist: ${ADMIN_IP_WHITELIST}
  crl-path: ${CRL_DIR:/app/crls}
  certificates-path: ${CERTS_DIR:/app/certs}
  crl-max-age-hours: ${CRL_MAX_AGE_HOURS:12}
  admins-file: ${ADMINS_FILE}
  mail:
    mode: smtp
    from: ${MAIL_FROM:noreply@company.ru}
    from-name: ${MAIL_FROM_NAME:ПАО "НБД-Банк"}

# CryptoPro не отключаем — он установлен в образе
crypto:
  pro:
    enabled: true

logging:
  level:
    root: WARN
    ru.example.ukep: INFO
    com.zaxxer.hikari: WARN
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.flywaydb: INFO
    ru.CryptoPro: INFO
  file:
    name: ${LOG_PATH:/var/log/afina/app.log}
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30
      total-size-cap: 3GB
      clean-history-on-start: false
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    console: "%d{HH:mm:ss.SSS} %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    mail:
      enabled: false   # SMTP может быть временно недоступен, это не критично