<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>НБД-Банк · Личный кабинет</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script src="https://www.cryptopro.ru/sites/default/files/products/cades/cadesplugin_api.js"></script>
</head>
<body>
<header class="app-header">
    <a th:href="@{/dashboard}" class="brand">
        <img src="/img/logo.png" alt="НБД-Банк" class="brand-logo">
    </a>
    <div class="header-user">
        <button type="button" class="cmdk-trigger" title="Поиск (⌘K)">
            🔍 <span style="opacity:0.6;">⌘K</span>
        </button>
        <span th:text="${user.fullName}">Пользователь</span>
        <form method="post" th:action="@{/logout}" style="display:inline">
            <button class="btn-ghost btn-sm" type="submit">Выйти</button>
        </form>
    </div>
</header>

<main>
    <div th:if="${ok}" class="alert ok" th:text="${ok}"></div>
    <div th:if="${err}" class="alert err" th:text="${err}"></div>
    <div th:if="${param.expired}" class="alert err">Сессия истекла. Войдите заново.</div>

    <h1>Мои разделы</h1>

    <div th:if="${allSignedCount == 0}"
         style="background:linear-gradient(135deg,#faf4ea 0%,#fff8ee 100%);
                border:1px solid #d4c3a7; border-radius:14px; padding:22px 26px;
                margin-bottom:24px;">
        <h2 style="margin:0 0 4px;font-size:18px;">👋 Добро пожаловать!</h2>
        <p style="margin:0 0 16px;font-size:14px;color:#6b5844;">
            Создайте раздел, откройте его, загрузите документы (можно несколько сразу) и подпишите их УКЭП.
        </p>
    </div>

    <div style="display:flex; gap:12px; flex-wrap:wrap; margin-bottom:24px; align-items:stretch;">
        <form method="post" th:action="@{/folders/create}" class="upload-form"
              style="flex:1; min-width:280px; margin:0;">
            <input type="text" name="name" required
                   placeholder="Название нового раздела (например: Учредительные)"
                   style="flex:1; padding:10px 12px; border:1px solid #d4c3a7;
                          border-radius:8px; font-size:14px;"/>
            <button type="submit">+ Создать раздел</button>
        </form>
        <button type="button" id="btn-use-template" class="btn"
                style="background:linear-gradient(135deg,#c49a6c,#a67c52); border:none;
                       color:#fff; white-space:nowrap;">
            ✨ Из шаблона
        </button>
    </div>

    <div th:if="${#lists.isEmpty(folders)}" class="empty-state">
        <span class="icon">📂</span>
        <h3>Пока нет ни одного раздела</h3>
        <p>Создайте первый раздел — потом загрузите в него документы.</p>
    </div>

    <div th:if="${not #lists.isEmpty(folders)}" class="user-list">
        <a th:each="f : ${folders}"
           th:href="@{'/folders/' + ${f.id}}"
           th:with="docs=${documentsByFolder.get(f.id)},
                    total=${#lists.size(docs)},
                    signed=${#lists.size(docs.?[signed])},
                    unsigned=${total - signed}"
           class="user-row folder-row">
            <div class="folder-icon-sm">📁</div>
            <div class="user-row-main">
                <div class="user-row-name" th:text="${f.name}">Раздел</div>
                <div class="user-row-sub">
                    <span th:text="${total} + ' док.'">0 док.</span>
                </div>
            </div>
            <div class="user-row-cell user-row-status">
                <span th:if="${signed > 0}" class="folder-tile-stat-ok">
                    ✅ <span th:text="${signed}">0</span>
                </span>
            </div>
            <div class="user-row-cell user-row-status">
                <span th:if="${unsigned > 0}" class="folder-tile-stat-warn">
                    ⚠️ <span th:text="${unsigned}">0</span>
                </span>
            </div>
            <div class="user-row-cell user-row-date"
                 th:text="${#temporals.format(f.createdAt,'dd.MM.yyyy')}">—</div>
            <div class="folder-tile-arrow">→</div>
        </a>
    </div>
</main>

<script th:inline="javascript">
    window.__FOLDERS__ = /*[[${folderOptions}]]*/ [];
</script>
<script th:src="@{/js/cert-selector.js}"></script>
<script th:src="@{/js/sign-progress.js}"></script>
<script th:src="@{/js/stamp.js}"></script>
<script th:src="@{/js/file-drop.js}"></script>
<script th:src="@{/js/batch-sign.js}"></script>
<script th:src="@{/js/template-use.js}"></script>
<script th:src="@{/js/command-palette.js}"></script>
<script th:src="@{/js/skeleton.js}"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        var btn = document.getElementById('btn-use-template');
        if (btn && window.TemplateUse) {
            btn.addEventListener('click', function () { window.TemplateUse.open(); });
        }
    });
</script>
</body>
</html>
