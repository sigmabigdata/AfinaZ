<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Афина · Вход администратора</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-page">
<div class="auth-card admin-auth">
    <div class="auth-logo">
        <img src="/img/logo.svg" alt="Афина" class="auth-logo-img">
    </div>

    <h2>Вход администратора</h2>
    <p class="subtitle">Доступно только с сервера и только по сертификату УКЭП</p>

    <div th:if="${param.logout}" class="alert ok">Вы вышли из системы</div>
    <div th:if="${param.expired}" class="alert err">Сессия истекла. Войдите заново.</div>
    <div th:if="${param.forbidden}" class="alert err">Недостаточно прав для доступа.</div>
    <div id="error-box" class="alert err" style="display:none"></div>

    <button id="btn-cert-login" type="button">
        🔐 Войти с УКЭП
    </button>

    <p id="status" class="muted small" style="text-align:center;margin-top:14px;"></p>

    <p class="alt-action muted" style="margin-top:24px;">
        <a th:href="@{/login}">← Вход для клиентов</a>
    </p>
</div>

<object id="cadesplugin" type="application/x-cades"
        classid="clsid:3F367B61-B3B9-4F5A-BCD6-827DA1C5C7D2"
        style="width:0;height:0"></object>

<script src="https://www.cryptopro.ru/sites/default/files/products/cades/cadesplugin_api.js"></script>
<script type="module" th:src="@{/js/admin-login.js}"></script>
</body>
</html>
