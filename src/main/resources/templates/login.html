<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Афина · Вход</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-page">
<div class="auth-card">
    <div class="auth-logo">
        <img src="/img/logo.svg" alt="Афина" class="auth-logo-img">
    </div>

    <h2>Вход в личный кабинет</h2>
    <p class="subtitle">Введите email — мы пришлём одноразовую ссылку для входа</p>

    <div th:if="${error}" class="alert err" th:text="${error}"></div>
    <div th:if="${param.logout}" class="alert ok">Вы вышли из системы</div>
    <div th:if="${param.expired}" class="alert err">Сессия истекла. Войдите заново.</div>
    <div th:if="${param.invalid}" class="alert err">Ссылка недействительна или истекла. Запросите новую.</div>

    <form method="post" th:action="@{/login}">
        <label>Email</label>
        <input type="email" name="email" required autofocus autocomplete="email"/>
        <button type="submit">Получить ссылку для входа</button>
    </form>

    <p class="alt-action muted">
        <a th:href="@{/admin/login}">Вход для администратора →</a>
    </p>
</div>
</body>
</html>
