spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

app:
  base-url: http://localhost:8080
  storage-path: /tmp/afina-test-storage
  logs-path: /tmp/afina-test-logs
  backups-path: /tmp/afina-test-backups
  crl-path: /tmp/afina-test-crls
  certificates-path: /tmp/afina-test-certs
  admins-file: /tmp/afina-test-admins.env
  admin-ip-whitelist: "*"
  mail:
    mode: log
    from: noreply@test.local
    from-name: Test

crypto:
  pro:
    enabled: false

logging:
  level:
    root: WARN
    ru.example.ukep: INFO
