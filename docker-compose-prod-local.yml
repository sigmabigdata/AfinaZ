# Локальная проверка prod-сборки БЕЗ CryptoPro.
# Проверка подписи — в dev-режиме нативно на macOS или на VPS.
services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile-postgres
    image: afina-postgres:16-pgaudit
    container_name: afina-postgres-prod-local
    environment:
      POSTGRES_DB: afina_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_SUPERUSER_PASSWORD:-local_test_password}
      DB_PASSWORD: ${DB_PASSWORD:-app_password_change_me}
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD:-migrator_password_change_me}
      DB_AUDITOR_PASSWORD: ${DB_AUDITOR_PASSWORD:-auditor_password_change_me}
    ports:
      - "5433:5432"
    volumes:
      - pgdata_prod_local:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    command: >
      postgres
        -c shared_preload_libraries=pgaudit,pg_stat_statements
        -c log_statement=none
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: afina-app:latest
    container_name: afina-app-prod-local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/afina_db
      DB_USER: afina_app
      DB_PASSWORD: ${DB_PASSWORD:-app_password_change_me}
      DB_MIGRATOR_USER: afina_migrator
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD:-migrator_password_change_me}
      APP_BASE_URL: http://localhost:8081
      APP_STORAGE_PATH: /app/storage/documents
      ADMINS_FILE: /app/admins.env
      CRL_PATH: /app/kontur-q-2025.crl
      ADMIN_IP_WHITELIST: 127.0.0.1,::1,172.0.0.0/8
      LOG_PATH: /var/log/afina/app.log
      MAIL_MODE: log
      MAIL_HOST: localhost
      MAIL_PORT: "25"
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
      MAIL_FROM: noreply@local
      SECURE_COOKIES: "false"
      CRYPTO_PRO_ENABLED: "false"
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
    ports:
      - "8081:8080"
    volumes:
      - ./storage:/app/storage
      - ./logs:/var/log/afina
      - ./admins.env:/app/admins.env:ro
      - ./kontur-q-2025.crl:/app/kontur-q-2025.crl:ro
    restart: unless-stopped

volumes:
  pgdata_prod_local:
