# ============================================================
# Афина · Production stack
# ============================================================
# Запуск: docker compose -f docker-compose-prod.yml --env-file .env.prod up -d
# ============================================================

services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile-postgres
    image: afina-postgres:16-pgaudit
    container_name: afina-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-afina_db}
      POSTGRES_USER: ${DB_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${DB_SUPERUSER_PASSWORD}
      # Пароли ролей для init-скрипта db/init/02_roles.sh
      DB_PASSWORD: ${DB_PASSWORD}
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD}
      DB_AUDITOR_PASSWORD: ${DB_AUDITOR_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    command: >
      postgres
        -c shared_preload_libraries=pgaudit,pg_stat_statements
        -c pg_stat_statements.track=all
        -c log_min_duration_statement=1000
        -c logging_collector=on
        -c log_directory=/var/lib/postgresql/data/pg_log
        -c log_filename='postgresql-%Y-%m-%d.log'
        -c log_rotation_age=1d
        -c log_rotation_size=100MB
        -c log_line_prefix='%m [%p] %q%u@%d '
        -c log_statement=none
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_SUPERUSER:-postgres} -d ${DB_NAME:-afina_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - afina

  app:
    build:
      context: .
      dockerfile: Dockerfile
    extra_hosts:
      - "host.docker.internal:172.18.0.1"
      - "mail.afinasystems.ru:172.18.0.1"
    image: afina-app:latest
    container_name: afina-app
    env_file:
      - .env.prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-afina_db}
      APP_STORAGE_PATH: /app/storage/documents
      ADMINS_FILE: /app/admins.env
      CRL_DIR: /app/crls
      LOG_PATH: /var/log/afina/app.log
      FILE_ENCRYPTION_KEY_PATH: /opt/afina/secrets/file.key
      TZ: Europe/Moscow
      JAVA_OPTS: "-Xms256m -Xmx1g -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
    volumes:
      - ./storage:/app/storage
      - ./logs:/var/log/afina
      - ./logs:/app/logs
      - ./backups:/app/backups
      - ./admins.env:/app/admins.env:ro
      - ./crls:/app/crls
      - ./secrets:/opt/afina/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    restart: unless-stopped
    networks:
      - afina

  angie:
    # Angie — форк Nginx, сертифицирован ФСТЭК. Заменяет Caddy.
    # Образ: официальный registry Angie (docker.angie.software)
    image: docker.angie.software/angie:1.12.3-alpine
    container_name: afina-angie
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./angie.conf:/etc/angie/angie.conf:ro
      - ./angie-certs:/var/www/acme
      - angie_data:/var/lib/angie
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - afina

volumes:
  pgdata:
  angie_data:

networks:
  afina:
    driver: bridge
