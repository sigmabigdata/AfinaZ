# ============================================================
# Афина · Production stack
# ============================================================
# Запуск: docker compose -f docker-compose-prod.yml --env-file .env.prod up -d
# ============================================================

services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile-postgres
    image: afinaz-postgres:15-astra
    container_name: afina-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-afina_db}
      POSTGRES_USER: ${DB_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${DB_SUPERUSER_PASSWORD}
      # Пароли ролей для init-скрипта db/init/02_roles.sh
      DB_PASSWORD: ${DB_PASSWORD}
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD}
      DB_AUDITOR_PASSWORD: ${DB_AUDITOR_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    volumes:
      - pgdata:/var/lib/postgresql/15/main
      - ./db/init:/docker-entrypoint-initdb.d:ro
    # shared_preload_libraries: pg_stat_statements из postgresql-contrib
    # pgaudit НЕ используется — в Astra Linux SE 1.8 его нет.
    # Аудит — встроенный Astra (PARSEC) + лог медленных запросов.
    command: >
      postgres
        -c shared_preload_libraries=pg_stat_statements
        -c pg_stat_statements.track=all
        -c log_min_duration_statement=1000
        -c log_statement=ddl
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_SUPERUSER:-postgres} -d ${DB_NAME:-afina_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - afina

  app:
    build:
      context: .
      dockerfile: Dockerfile
    extra_hosts:
      - "host.docker.internal:172.18.0.1"
      - "mail.afinasystems.ru:172.18.0.1"
    image: afinaz-app:latest
    container_name: afina-app
    env_file:
      - .env.prod
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      APP_SETUP_MODE: ${APP_SETUP_MODE:-false}
      APP_SETUP_TOKEN: ${APP_SETUP_TOKEN:-}
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-afina_db}
      APP_STORAGE_PATH: /app/storage/documents
      ADMINS_FILE: /app/admins.env
      CRL_DIR: /app/crls
      CRYPTO_PRO_JCP_LICENSE: ${JCP_LICENSE:-}
      LOG_PATH: /var/log/afina/app.log
      FILE_ENCRYPTION_KEY_PATH: /opt/afinaz/secrets/file.key
      TZ: Europe/Moscow
      JAVA_OPTS: "-Xms512m -Xmx1536m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/var/log/afina/heapdump.hprof"
    volumes:
      - ./storage:/app/storage
      - ./logs:/var/log/afina
      - ./logs:/app/logs
      - ./backups:/app/backups
      - ./admins.env:/app/admins.env:rw
      - ./crls:/app/crls
      - ./certs:/app/certs:ro
      - ./secrets:/opt/afinaz/secrets:ro
      - ./secrets/keys:/opt/afinaz/secrets/keys:rw
      # Только для /admin/system/cleanup. --volumes НИКОГДА не передаётся.
      - /var/run/docker.sock:/var/run/docker.sock
      - ./angie-certs:/opt/afinaz/angie-certs
      - ./setup-out:/app/setup-out:rw
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    # GID docker-группы на хосте — нужен для доступа к /var/run/docker.sock
    # (cleanup docker из UI). На сервере: stat -c '%g' /var/run/docker.sock
    group_add:
      - "1000"
    restart: unless-stopped
    networks:
      - afina

  angie:
    # Angie — форк Nginx, сертифицирован ФСТЭК. Заменяет Caddy.
    # Образ: официальный registry Angie (docker.angie.software)
    image: docker.angie.software/angie:1.12.3-alpine
    container_name: afina-angie
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./angie.conf:/etc/angie/angie.conf:ro
      - ./angie-certs:/etc/angie/certs:ro
      - angie_data:/var/lib/angie
    depends_on:
      - app
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - afina

volumes:
  pgdata:
  angie_data:

networks:
  afina:
    driver: bridge
